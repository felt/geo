name: Elixir Unit Tests

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - "**"

jobs:
  build:
    name: Elixir Unit Tests
    runs-on: ubuntu-24.04
    env:
      MIX_ENV: test
    strategy:
      fail-fast: false
      matrix:
        # Each Elixir version against the OTP versions it supports:
        # https://hexdocs.pm/elixir/compatibility-and-deprecations.html
        include:
          - { elixir: "1.16.3", otp: "24.3.4.17" }
          - { elixir: "1.16.3", otp: "25.3.2.21" }
          - { elixir: "1.16.3", otp: "26.2.5.21" }
          - { elixir: "1.17.3", otp: "25.3.2.21" }
          - { elixir: "1.17.3", otp: "26.2.5.21" }
          - { elixir: "1.17.3", otp: "27.3.4.19" }
          - { elixir: "1.18.6", otp: "25.3.2.21" }
          - { elixir: "1.18.6", otp: "26.2.5.21" }
          - { elixir: "1.18.6", otp: "27.3.4.19" }
          - { elixir: "1.19.7", otp: "26.2.5.21" }
          - { elixir: "1.19.7", otp: "27.3.4.19" }
          - { elixir: "1.19.7", otp: "28.5.0.8" }

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Elixir Project
        uses: ./.github/actions/elixir-setup
        with:
          elixir-version: ${{ matrix.elixir }}
          otp-version: ${{ matrix.otp }}
          build-app: false

      - name: Compile with warnings as errors
        run: mix compile --warnings-as-errors

      - name: Run tests with warnings as errors
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        uses: nick-fields/retry@v4
        with:
          max_attempts: 3
          timeout_minutes: 5
          command: mix test --warnings-as-errors
          new_command_on_retry: mix test --warnings-as-errors --failed
